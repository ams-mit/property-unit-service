version: '3.8'

services:
  property_db:
    image: mysql:8
    container_name: property_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: property_db
      MYSQL_USER: property_user
      MYSQL_PASSWORD: property_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "property_user", "-pproperty_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  property-unit-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-unit-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://property_db:3306/property_db
      DB_USERNAME: property_user
      DB_PASSWORD: property_pass
    depends_on:
      property_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
