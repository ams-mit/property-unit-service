name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Property Unit Service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: property_db
          MYSQL_USER: property_user
          MYSQL_PASSWORD: property_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Grant MySQL user access from localhost
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -prootpassword -e \
            "CREATE USER IF NOT EXISTS 'property_user'@'localhost' IDENTIFIED BY 'property_pass'; \
             GRANT ALL PRIVILEGES ON property_db.* TO 'property_user'@'localhost'; \
             FLUSH PRIVILEGES;"

      - name: Build and Test
        run: mvn clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/property_db
