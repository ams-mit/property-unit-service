spring.application.name=property-unit-service
# Server Configuration
server.port=8083

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/property_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema Management (Flyway & Hibernate)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Expose Actuator Endpoints
management.endpoints.web.exposure.include=health,info

# JWT Security Configuration
service.name=property-unit-service
jwt.algorithm=RS256
jwt.gateway.public-key=${GATEWAY_JWT_PUBLIC_KEY}
jwt.service.private-key=${SERVICE_JWT_PRIVATE_KEY}
jwt.service.expires-in=${SERVICE_JWT_EXPIRES_IN:5m}


