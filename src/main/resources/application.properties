spring.application.name=property-unit-service
server.port=8082
# MySQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/property_db}
spring.datasource.username=${DB_USERNAME:property_user}
spring.datasource.password=${DB_PASSWORD:property_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema Management (Flyway & Hibernate)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Expose Actuator Endpoints
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info

# JWT Security Configuration
service.name=property-unit-service
jwt.algorithm=RS256
jwt.gateway.public-key=${GATEWAY_JWT_PUBLIC_KEY}
jwt.service.private-key=${SERVICE_JWT_PRIVATE_KEY}
jwt.service.expires-in=${SERVICE_JWT_EXPIRES_IN:5m}



group1.identity.service.url=http://localhost:8081
