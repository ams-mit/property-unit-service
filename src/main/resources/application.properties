spring.application.name=property-unit-service
# MySQL Database Connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/property_db
spring.datasource.username=${DB_USERNAME:property_user}
spring.datasource.password=${DB_PASSWORD:property_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema Management (Flyway & Hibernate)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Expose Actuator Endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

group1.identity.service.url=http://localhost:8081