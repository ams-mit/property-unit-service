spring.application.name=property-unit-service
server.port=8082
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/property_unit_db}
spring.datasource.username=${DB_USERNAME:property_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
gateway.jwt.public-key=${GATEWAY_JWT_PUBLIC_KEY:}
service.jwt.private-key=${SERVICE_JWT_PRIVATE_KEY:}
project.gateway.base-url=${API_GATEWAY_URL:http://localhost:8080}
project.http.connect-timeout=${DEPENDENCY_CONNECT_TIMEOUT:2s}
project.http.read-timeout=${DEPENDENCY_READ_TIMEOUT:5s}
springdoc.swagger-ui.path=/swagger-ui.html
